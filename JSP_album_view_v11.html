<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JSP 清掃アルバム Ver.11 閲覧テスト</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#1c2938;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:18px 14px 60px}h1{font-size:23px;margin:12px 0}h2{font-size:18px}.panel{background:#fff;border:1px solid #dfe5ed;border-radius:14px;padding:16px;margin:14px 0}p{line-height:1.6}.muted{color:#596a7c;font-size:13px}.notice{background:#eaf3ff;border-radius:9px;padding:12px}.warn{background:#fff4da;border-radius:9px;padding:12px}input{display:block;width:100%;max-width:520px;margin:8px 0;padding:12px;border:1px solid #ccd5df;border-radius:9px;font-size:16px}button{border:0;border-radius:9px;padding:12px 16px;background:#1763c6;color:#fff;font-weight:700;font-size:15px;margin:4px 5px 4px 0;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#e8edf5;color:#24364d}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{position:relative;border:0;background:#e9edf3;padding:0;margin:0;aspect-ratio:1;overflow:hidden;border-radius:6px}.tile img{width:100%;height:100%;object-fit:cover;display:block}.tile span{position:absolute;bottom:4px;right:5px;background:#0009;color:white;font-size:11px;border-radius:4px;padding:2px 5px}.tile.error{font-size:12px;padding:12px;color:#9b2732}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.count{font-weight:700}.viewer{position:fixed;inset:0;background:#090b10f5;color:white;z-index:10;display:none;flex-direction:column}.viewer.open{display:flex}.viewerHead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:10px}.viewerHead button,.viewerNav button{background:#ffffff27;color:#fff}.viewerImg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}.viewerImg img{max-width:100%;max-height:100%;object-fit:contain}.viewerNav{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 18px;gap:8px}.viewerNav span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}.status{font-weight:700;overflow-wrap:anywhere}@media(min-width:700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}}
</style></head><body><main><h1>JSP 清掃アルバム <small>Ver.11</small></h1><p class="notice">閲覧機能のテスト版です。Ver.10で保存した写真を表示します。写真の追加・削除は行いません。現段階では閲覧にもFirebaseログインが必要です。</p>
<section class="panel"><h2>① Firebaseログイン</h2><p id="authStatus" class="status">接続中...</p><input id="email" type="email" autocomplete="username" placeholder="登録済みメールアドレス"><input id="password" type="password" autocomplete="current-password" placeholder="パスワード"><button id="login">ログイン</button><button id="logout" class="secondary" disabled>ログアウト</button></section>
<section class="panel"><h2>② アルバムを開く</h2><p class="muted">Ver.10の結果に表示された「保存先」を入力してください。例：albums/v10-test-20261028123456-xxxxxxxx/</p><input id="folder" spellcheck="false" autocapitalize="off" placeholder="albums/v10-test-.../"><div class="toolbar"><button id="open" disabled>アルバムを表示</button><button id="paste" class="secondary">貼り付け</button></div><p id="status" class="status">ログインして保存先を入力してください。</p><div id="info" class="muted"></div></section>
<section class="panel"><h2>③ 写真一覧 <span id="count" class="count">0枚</span></h2><p class="muted">写真をタップすると拡大表示します。拡大画面では左右スワイプで切り替えできます。</p><div id="grid" class="grid"></div></section>
</main><div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="写真拡大表示"><div class="viewerHead"><strong id="viewerCount">1 / 1</strong><button id="close">閉じる ✕</button></div><div id="viewerImg" class="viewerImg"><img id="large" alt="拡大写真"></div><div class="viewerNav"><button id="prev">❮ 前へ</button><span id="filename"></span><button id="next">次へ ❯</button></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getStorage,ref,listAll,getDownloadURL} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js';
const app=initializeApp({apiKey:'AIzaSyB4GGNl7duF-UBbPiLxFlqkV622U1pd_A8',authDomain:'jsp-cleaning-album.firebaseapp.com',projectId:'jsp-cleaning-album',storageBucket:'jsp-cleaning-album.firebasestorage.app',messagingSenderId:'1042829628780',appId:'1:1042829628780:web:ecbcfa9c9a149e0a64cf49'});
const auth=getAuth(app),storage=getStorage(app),$=id=>document.getElementById(id);let user=null,photos=[],index=0,loading=false,loadSeq=0;
function controls(){$('login').disabled=!!user;$('logout').disabled=!user;$('open').disabled=!user||loading}
onAuthStateChanged(auth,u=>{user=u;$('authStatus').textContent=u?'ログイン中：'+u.email:'未ログイン';controls()});
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value=''}catch(e){$('authStatus').textContent='ログイン失敗：'+(e.message||e)}};
$('logout').onclick=async()=>{await signOut(auth);photos=[];render();closeViewer()};
$('paste').onclick=async()=>{try{$('folder').value=(await navigator.clipboard.readText()).trim()}catch(e){$('status').textContent='貼り付けできません。保存先を長押しで貼り付けてください。'}};
function normalizeFolder(value){let s=value.trim();if(s.startsWith('gs://')||s.startsWith('https://'))throw Error('URLではなく「albums/v10-test-.../」形式で入力してください');s=s.replace(/^\/+|\/+$/g,'');if(!/^albums\/v10-test-[a-zA-Z0-9-]+$/.test(s))throw Error('Ver.10の保存先を正確に入力してください（albums/v10-test-.../）');return s}
function render(){const grid=$('grid');grid.replaceChildren();$('count').textContent=photos.length+'枚';const frag=document.createDocumentFragment();photos.forEach((p,i)=>{const b=document.createElement('button');b.className='tile';b.type='button';b.setAttribute('aria-label',(i+1)+'枚目を開く');const img=document.createElement('img');img.loading='lazy';img.decoding='async';img.src=p.url;img.alt=(i+1)+'枚目';img.onerror=()=>{b.classList.add('error');img.remove();b.append(document.createTextNode('画像を表示できません'))};const num=document.createElement('span');num.textContent=i+1;b.append(img,num);b.onclick=()=>showViewer(i);frag.append(b)});grid.append(frag)}
async function loadAlbum(){if(!user||loading)return;let folder;try{folder=normalizeFolder($('folder').value)}catch(e){$('status').textContent=e.message;return}loading=true;controls();const seq=++loadSeq;photos=[];render();$('info').textContent='';$('status').textContent='写真一覧を取得しています...';try{const result=await listAll(ref(storage,folder));const items=result.items.filter(x=>/\.jpe?g$/i.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(items.length===0){$('status').textContent='このフォルダに写真がありません。保存先を確認してください。';return}let finished=0;const found=new Array(items.length);let cursor=0;async function worker(){while(cursor<items.length){const i=cursor++;try{found[i]={name:items[i].name,url:await getDownloadURL(items[i])}}catch(e){found[i]={name:items[i].name,url:'',error:e.message||String(e)}}finished++;if(seq===loadSeq)$('status').textContent='読み込み中：'+finished+' / '+items.length+'枚'}}await Promise.all(Array.from({length:Math.min(6,items.length)},()=>worker()));if(seq!==loadSeq)return;photos=found.filter(p=>p.url);render();$('status').textContent='読み込み完了：'+photos.length+'枚'+(photos.length!==items.length?'（URL取得失敗 '+(items.length-photos.length)+'枚）':'');$('info').textContent='保存先：'+folder+'/　｜　写真枚数：'+items.length+'枚　｜　物件名・清掃日はVer.12以降で管理予定';}catch(e){$('status').textContent='取得エラー：'+(e.code||e.name||'Error')+' '+(e.message||e)+'。FirebaseのログインとStorageルールを確認してください。'}finally{loading=false;controls()}}
$('open').onclick=loadAlbum;
function showViewer(i){if(!photos.length)return;index=(i+photos.length)%photos.length;$('viewer').classList.add('open');document.body.style.overflow='hidden';updateViewer()}
function updateViewer(){$('viewerCount').textContent=(index+1)+' / '+photos.length;$('large').src=photos[index].url;$('filename').textContent=photos[index].name;$('prev').disabled=photos.length<2;$('next').disabled=photos.length<2}
function closeViewer(){$('viewer').classList.remove('open');document.body.style.overflow='';$('large').removeAttribute('src')}
$('close').onclick=closeViewer;$('prev').onclick=()=>showViewer(index-1);$('next').onclick=()=>showViewer(index+1);
let startX=null;const area=$('viewerImg');area.addEventListener('touchstart',e=>{startX=e.touches[0]?.clientX??null},{passive:true});area.addEventListener('touchend',e=>{if(startX===null)return;const dx=(e.changedTouches[0]?.clientX??startX)-startX;if(Math.abs(dx)>55)showViewer(index+(dx<0?1:-1));startX=null},{passive:true});document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('open'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowRight')showViewer(index+1);if(e.key==='ArrowLeft')showViewer(index-1)});
controls();
</script></body></html>
