<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JSP 清掃アルバム Ver.12.1 共有テスト</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;background:#f3f6fa;color:#203044}*{box-sizing:border-box}body{margin:0}main{max-width:950px;margin:auto;padding:18px 14px 70px}h1{font-size:23px}h2{font-size:18px}.panel{background:white;border:1px solid #dce3ec;border-radius:13px;padding:16px;margin:14px 0}.muted{font-size:13px;color:#58697c;line-height:1.6}.notice{background:#eaf3ff;padding:12px;border-radius:9px;line-height:1.6}input{width:100%;padding:12px;border:1px solid #c8d3e0;border-radius:8px;font-size:16px;margin:6px 0}button{border:0;border-radius:8px;background:#1764c7;color:#fff;padding:12px 16px;font-weight:700;font-size:15px;margin:5px 5px 5px 0}button:disabled{opacity:.45}.secondary{background:#e7edf5;color:#24364d}.status{font-weight:700;overflow-wrap:anywhere;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{padding:0;border:0;border-radius:6px;background:#e9eef5;aspect-ratio:1;overflow:hidden;margin:0}.tile img{width:100%;height:100%;object-fit:cover;display:block}.viewer{position:fixed;inset:0;background:#080a0ff5;color:white;z-index:20;display:none;flex-direction:column}.viewer.open{display:flex}.viewerHead,.viewerFoot{display:flex;justify-content:space-between;align-items:center;padding:10px;gap:8px}.viewerHead button,.viewerFoot button{background:#ffffff2a}.viewerImg{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;touch-action:pan-y}.viewerImg img{max-width:100%;max-height:100%;object-fit:contain}.hide{display:none!important}#shareLink{overflow-wrap:anywhere;font-size:13px;line-height:1.6}#info{margin:8px 0 14px}@media(min-width:700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}}
</style></head><body><main><h1>JSP 清掃アルバム <small>Ver.12.1</small></h1><p class="notice" id="intro">Firestoreを利用する共有リンクのテスト版です。初回はFirestore作成とルール設定が必要です。既存写真の削除・変更は行いません。</p>
<section id="editor" class="panel"><h2>① 管理者・清掃員ログイン</h2><p id="authStatus" class="status">接続中...</p><input id="email" type="email" autocomplete="username" placeholder="Firebase登録済みメールアドレス"><input id="password" type="password" autocomplete="current-password" placeholder="パスワード"><button id="login">ログイン</button><button id="logout" class="secondary" disabled>ログアウト</button><h2>② 共有リンクを作成</h2><p class="muted">Ver.10の保存先を入力してください。例：albums/v10-test-20261028123456-xxxxxxxx/</p><input id="folder" autocapitalize="off" spellcheck="false" placeholder="albums/v10-test-.../"><input id="property" placeholder="物件名（任意）" maxlength="100"><label for="cleanDate" class="muted">清掃日（任意）</label><input id="cleanDate" type="date"><button id="create" disabled>共有リンクを発行</button><p id="createStatus" class="status">ログイン後に発行できます。</p><div id="shareResult" class="hide"><p class="muted">このURLを受け取った人はログインせず閲覧できます。写真URLは再発行・失効管理が未実装です。転送・公開に注意してください。</p><div id="shareLink"></div><button id="copy">共有URLをコピー</button><button id="preview" class="secondary">共有画面を確認</button></div></section>
<section id="album" class="panel hide"><h2 id="albumTitle">アルバム</h2><div id="info" class="muted"></div><p id="viewStatus" class="status">読み込み中...</p><div id="grid" class="grid"></div></section>
</main><div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="写真拡大表示"><div class="viewerHead"><strong id="viewerCount"></strong><button id="close">閉じる ✕</button></div><div id="viewerImg" class="viewerImg"><img id="large" alt="拡大写真"></div><div class="viewerFoot"><button id="prev">❮ 前へ</button><span id="filename" class="muted"></span><button id="next">次へ ❯</button></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getStorage,ref,listAll,getDownloadURL} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js';
import {getFirestore,doc,setDoc,getDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyB4GGNl7duF-UBbPiLxFlqkV622U1pd_A8',authDomain:'jsp-cleaning-album.firebaseapp.com',projectId:'jsp-cleaning-album',storageBucket:'jsp-cleaning-album.firebasestorage.app',messagingSenderId:'1042829628780',appId:'1:1042829628780:web:ecbcfa9c9a149e0a64cf49'});
const auth=getAuth(app),storage=getStorage(app),db=getFirestore(app),$=id=>document.getElementById(id);let user=null,photos=[],current=0,shareUrl='',busy=false;
const setStatus=(id,msg)=>$(id).textContent=msg;
const err=e=>(e?.code?e.code+': ':'')+(e?.message||String(e));
const shareMode=location.hash.startsWith('#share=');
if(shareMode){$('editor').classList.add('hide');$('intro').textContent='共有された清掃アルバムです。ログイン不要で閲覧できます。';loadShared();}
else onAuthStateChanged(auth,u=>{user=u;setStatus('authStatus',u?'ログイン中：'+u.email:'未ログイン');$('login').disabled=!!u;$('logout').disabled=!u;$('create').disabled=!u||busy;});
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value='';}catch(e){setStatus('authStatus','ログイン失敗：'+err(e));}};
$('logout').onclick=async()=>{try{await signOut(auth)}catch(e){setStatus('authStatus',err(e))}};
function normalizeFolder(v){const s=v.trim().replace(/^\/+|\/+$/g,'');if(!/^albums\/v10-test-[a-zA-Z0-9-]+$/.test(s))throw Error('Ver.10の保存先を albums/v10-test-.../ 形式で入力してください');return s}
function randomId(){return Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('')}
async function createShare(){if(!user||busy)return;let folder;try{folder=normalizeFolder($('folder').value)}catch(e){setStatus('createStatus',e.message);return}busy=true;$('create').disabled=true;$('shareResult').classList.add('hide');setStatus('createStatus','写真一覧を取得中...');try{
const listed=await listAll(ref(storage,folder));const items=listed.items.filter(x=>/\.jpe?g$/i.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!items.length)throw Error('保存先にJPEG写真がありません');if(items.length>100)throw Error('写真が100枚を超えています');
const found=new Array(items.length);let cursor=0,done=0;async function worker(){while(cursor<items.length){const i=cursor++;found[i]={name:items[i].name,url:await getDownloadURL(items[i])};done++;setStatus('createStatus',`写真URL取得：${done}/${items.length}枚`);}}await Promise.all(Array.from({length:Math.min(5,items.length)},()=>worker()));
const manifest={version:1,property:$('property').value.trim().slice(0,100),date:$('cleanDate').value,createdAt:new Date().toISOString(),photos:found};const id=randomId();setStatus('createStatus','共有情報をFirestoreに保存しています...');await setDoc(doc(db,'sharedAlbums',id),manifest);
shareUrl=location.origin+location.pathname+'#share='+id;$('shareLink').textContent=shareUrl;$('shareResult').classList.remove('hide');setStatus('createStatus',`${found.length}枚の共有リンクを発行しました。`);
}catch(e){setStatus('createStatus','発行失敗：'+err(e))}finally{busy=false;$('create').disabled=!user;}}
$('create').onclick=createShare;
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(shareUrl);setStatus('createStatus','共有URLをコピーしました')}catch(e){setStatus('createStatus','コピーできません。表示されたURLを長押ししてコピーしてください。')}};
$('preview').onclick=()=>{if(shareUrl)location.href=shareUrl};
async function loadShared(){try{const id=location.hash.slice('#share='.length);if(!/^[0-9a-f]{48}$/.test(id))throw Error('共有リンクの形式が正しくありません');$('album').classList.remove('hide');const snap=await getDoc(doc(db,'sharedAlbums',id));if(!snap.exists())throw Error('共有アルバムが見つかりません');const data=snap.data();if(data.version!==1||!Array.isArray(data.photos)||data.photos.length>100)throw Error('共有データの形式が不正です');photos=data.photos.filter(p=>typeof p.url==='string'&&p.url.startsWith('https://firebasestorage.googleapis.com/')&&typeof p.name==='string');$('albumTitle').textContent=data.property||'清掃アルバム';$('info').textContent=[data.date?'清掃日：'+data.date:'','写真：'+photos.length+'枚'].filter(Boolean).join('　｜　');render();setStatus('viewStatus',photos.length+'枚の写真を表示しています。');}catch(e){$('album').classList.remove('hide');setStatus('viewStatus','閲覧エラー：'+err(e));}}
function render(){const g=$('grid');g.replaceChildren();const f=document.createDocumentFragment();photos.forEach((p,i)=>{const b=document.createElement('button');b.className='tile';b.type='button';b.setAttribute('aria-label',(i+1)+'枚目');const img=document.createElement('img');img.src=p.url;img.loading='lazy';img.alt=(i+1)+'枚目';img.onerror=()=>{img.alt='画像を表示できません'};b.append(img);b.onclick=()=>show(i);f.append(b)});g.append(f)}
function show(i){if(!photos.length)return;current=(i+photos.length)%photos.length;$('viewer').classList.add('open');document.body.style.overflow='hidden';$('large').src=photos[current].url;$('viewerCount').textContent=(current+1)+' / '+photos.length;$('filename').textContent=photos[current].name;}
function close(){ $('viewer').classList.remove('open');document.body.style.overflow='';$('large').removeAttribute('src')}
$('close').onclick=close;$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);let touch=null;$('viewerImg').addEventListener('touchstart',e=>{touch=e.touches[0]?.clientX??null},{passive:true});$('viewerImg').addEventListener('touchend',e=>{if(touch===null)return;const dx=(e.changedTouches[0]?.clientX??touch)-touch;if(Math.abs(dx)>55)show(current+(dx<0?1:-1));touch=null},{passive:true});document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
</script></body></html>
