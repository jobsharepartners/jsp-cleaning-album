<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JSP 清掃アルバム 試作版</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#172333;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px 14px 50px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#68768b;margin-top:5px}.tag{background:#e6f1ff;color:#205ca2;padding:7px 10px;border-radius:20px;font-size:12px}.card{background:white;border:1px solid #e4e9f1;border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 2px 10px #17233308}.prop{font-weight:700;font-size:17px;margin-bottom:5px}.muted{color:#68768b;font-size:13px}.picker{display:block;text-align:center;border:2px dashed #9eb8d5;border-radius:15px;padding:30px 12px;background:#f8fbff;cursor:pointer}.picker strong{display:block;font-size:17px;margin:7px 0}.picker span{font-size:12px;color:#66768a}input[type=file]{display:none}.controls{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:10px;padding:13px 14px;font-size:14px;font-weight:700;background:#2169b7;color:white;cursor:pointer;flex:1}.btn.secondary{background:#eaf0f7;color:#27415e}.btn:disabled{opacity:.45}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat{background:#f5f8fc;padding:12px;border-radius:10px}.stat b{display:block;font-size:19px;margin-top:5px}.progress{height:9px;background:#e6ebf3;border-radius:99px;overflow:hidden;margin:12px 0 5px}.bar{height:100%;background:#27866b;width:0%;transition:width .2s}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.item{position:relative;aspect-ratio:1;background:#e9edf2;border-radius:9px;overflow:hidden}.item img{width:100%;height:100%;object-fit:cover}.item button{position:absolute;top:4px;right:4px;border:0;background:#152435ce;color:white;border-radius:50%;width:25px;height:25px;font-size:17px}.empty{text-align:center;padding:30px 0;color:#8290a0}.foot{font-size:12px;line-height:1.6;color:#68768b}.status{font-size:13px;color:#315d83;min-height:20px}.small{font-size:12px;color:#697a90}</style></head><body><main class="wrap"><header><div><h1>JSP 清掃アルバム</h1><div class="sub">iPhone写真アップロード・試作版 Ver.1</div></div><div class="tag">保存なし・試作</div></header><section class="card"><div class="prop">テスト物件 101号室</div><div class="muted" id="date"></div></section><section class="card"><label class="picker" for="photos"><div style="font-size:32px">📷</div><strong>写真をまとめて選択</strong><span>iPhoneの写真ライブラリから複数選択できます（最大100枚）</span></label><input id="photos" type="file" accept="image/*" multiple><div class="controls"><button class="btn" id="compress" disabled>写真を圧縮して確認</button><button class="btn secondary" id="reset" disabled>すべてクリア</button></div><div class="stats"><div class="stat"><span class="small">選択した写真</span><b id="count">0枚</b></div><div class="stat"><span class="small">元の合計容量</span><b id="original">0 MB</b></div><div class="stat"><span class="small">圧縮後の合計容量</span><b id="compressed">—</b></div><div class="stat"><span class="small">圧縮完了</span><b id="done">0 / 0</b></div></div><div class="progress"><div class="bar" id="bar"></div></div><p class="status" id="status">写真を選択してください。</p></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><strong>選択写真プレビュー</strong><span class="small" id="previewCount">0枚</span></div><div id="grid" class="grid"></div><div id="empty" class="empty">写真がまだ選択されていません</div></section><p class="foot">※この試作版は写真を外部に送信・保存しません。圧縮はiPhone内のブラウザで実行します。写真100枚の処理には端末によって時間がかかる場合があります。HEIC等、一部形式はブラウザによって読み込めないことがあります。圧縮処理中は画面を閉じないでください。</p></main><script>const MAX=100, MAX_SIDE=1600, QUALITY=.76;let items=[],busy=false;const $=id=>document.getElementById(id);$('date').textContent='清掃日：'+new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric'}).format(new Date());function mb(n){return (n/1048576).toFixed(1)+' MB'}function update(){const size=items.reduce((s,x)=>s+x.file.size,0),cs=items.filter(x=>x.blob).reduce((s,x)=>s+x.blob.size,0),done=items.filter(x=>x.blob).length;$('count').textContent=items.length+'枚';$('original').textContent=mb(size);$('compressed').textContent=done?mb(cs):'—';$('done').textContent=done+' / '+items.length;$('previewCount').textContent=items.length+'枚';$('compress').disabled=!items.length||busy;$('reset').disabled=!items.length||busy;$('empty').style.display=items.length?'none':'block';}function render(){const g=$('grid');g.replaceChildren();for(const x of items){const d=document.createElement('div');d.className='item';const img=document.createElement('img');img.src=x.preview;img.alt='選択した写真';img.loading='lazy';const b=document.createElement('button');b.textContent='×';b.title='この写真を除外';b.disabled=busy;b.onclick=()=>{URL.revokeObjectURL(x.preview);items=items.filter(v=>v!==x);render();update()};d.append(img,b);g.append(d)}update()}$('photos').addEventListener('change',e=>{const files=[...e.target.files].filter(f=>f.type.startsWith('image/')||/\.(heic|heif)$/i.test(f.name));let added=0;for(const file of files){if(items.length>=MAX)break;items.push({file,preview:URL.createObjectURL(file),blob:null});added++}e.target.value='';render();$('status').textContent=files.length>added?`上限100枚のため、${files.length-added}枚は追加されませんでした。`:`${added}枚を追加しました。`;});$('reset').onclick=()=>{items.forEach(x=>URL.revokeObjectURL(x.preview));items=[];render();$('bar').style.width='0%';$('status').textContent='写真を選択してください。'};async function compress(file){const bitmap=await createImageBitmap(file);const scale=Math.min(1,MAX_SIDE/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('画像変換に失敗')),'image/jpeg',QUALITY))}$('compress').onclick=async()=>{busy=true;update();let ok=0,failed=0;for(let i=0;i<items.length;i++){const x=items[i];if(!x.blob){try{x.blob=await compress(x.file);ok++}catch(e){failed++;console.warn(x.file.name,e)}}$('bar').style.width=Math.round((i+1)/items.length*100)+'%';$('status').textContent=`圧縮中：${i+1} / ${items.length}枚`;await new Promise(r=>setTimeout(r,0))}busy=false;update();$('status').textContent=`圧縮処理完了：成功 ${items.filter(x=>x.blob).length}枚、失敗 ${failed}枚。写真は送信されていません。`};update();</script></body></html>
